name: Build Cuberite (Alpine / musl)

on:
  workflow_dispatch:
    inputs:
      cuberite_ref:
        description: "Cuberite branch/tag/commit to build"
        required: false
        default: "master"
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on Alpine
    runs-on: ubuntu-latest
    # NOTE: build runs inside an Alpine container so the binary is linked
    # against musl libc, not glibc.
    container:
      image: alpine:3.20

    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}

    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            git bash make cmake ninja build-base \
            linux-headers curl tar \
            python3 perl

      - name: Checkout Cuberite (with submodules)
        run: |
          git clone --recursive --depth 1 \
            --branch "${{ github.event.inputs.cuberite_ref || 'master' }}" \
            https://github.com/cuberite/cuberite.git

      - name: Configure (CMake)
        working-directory: cuberite
        run: |
          mkdir Release
          cd Release
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DDISABLE_SYSTEM_LUA=ON \
            ..

      - name: Build
        working-directory: cuberite/Release
        run: ninja -j"$(nproc)"

      - name: Smoke test (basic startup check)
        working-directory: cuberite/Server
        run: |
          # Cuberite needs the accompanying Server directory assets next to the binary
          timeout 5 ./Cuberite || true
          file ./Cuberite
          ldd ./Cuberite || true

      - name: Package build output
        id: package
        run: |
          NAME="cuberite-alpine-musl-${{ github.sha }}"
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/${NAME}.tar.gz"

          # Archive is written to an absolute path OUTSIDE the Server
          # directory being packaged, to avoid tar including/corrupting
          # itself while it is still being written.
          cd cuberite/Server
          tar -czf "${ARCHIVE_PATH}" .

          echo "archive_name=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify archive contents
        run: |
          echo "Listing archive contents:"
          tar -tzf "${{ steps.package.outputs.archive_path }}"
          echo "Confirming the Cuberite binary is present:"
          tar -tzf "${{ steps.package.outputs.archive_path }}" | grep -qx './Cuberite'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # This job intentionally runs OUTSIDE the Alpine container.
    # Release-creation actions ship a glibc-linked Node runtime, which
    # does not run correctly on musl (Alpine), so it must run on the
    # default Ubuntu runner instead.
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.publish_release == 'true'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.archive_name }}
          path: dist

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Cuberite (Alpine/musl) - ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: dist/${{ needs.build.outputs.archive_name }}
