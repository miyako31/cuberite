name: Build Cuberite (Alpine / musl)

on:
  workflow_dispatch:
    inputs:
      cuberite_ref:
        description: "Cuberite branch/tag/commit to build"
        required: false
        default: "master"
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on Alpine
    runs-on: ubuntu-latest
    # NOTE: build runs inside an Alpine container so the binary is linked
    # against musl libc, not glibc.
    container:
      image: alpine:3.20

    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}

    # Force bash for every step in this job. Without this, GitHub Actions
    # may default to /bin/sh (busybox ash) inside the Alpine container,
    # which does not understand bash-only syntax like ${PIPESTATUS[0]}.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        # bash is not installed yet at this point, so this one step must
        # explicitly use the container's default /bin/sh (busybox ash).
        shell: sh
        run: |
          apk add --no-cache \
            git bash make cmake ninja build-base \
            linux-headers curl tar file \
            python3 perl

      - name: Checkout Cuberite (with submodules)
        run: |
          git clone --recursive --depth 1 \
            --branch "${{ github.event.inputs.cuberite_ref || 'master' }}" \
            https://github.com/cuberite/cuberite.git

      - name: Configure (CMake)
        working-directory: cuberite
        run: |
          mkdir Release
          cd Release
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DDISABLE_SYSTEM_LUA=ON \
            -DWHOLE_PROGRAM_OPTIMISATION=OFF \
            ..

      - name: Build
        working-directory: cuberite/Release
        run: |
          echo "Memory before build:"
          free -h

          set +e
          ninja -j"$(nproc)" -v 2>&1 | tee ninja-build.log
          NINJA_EXIT=${PIPESTATUS[0]}
          set -e

          echo "Memory after build:"
          free -h

          if [ "$NINJA_EXIT" -ne 0 ]; then
            echo "::error::ninja exited with code $NINJA_EXIT"
            echo "Last 100 lines of the build log:"
            tail -100 ninja-build.log
            echo "Kernel OOM / dmesg messages (if accessible in this container):"
            dmesg 2>&1 | tail -80 || echo "dmesg is not accessible in this environment"
            exit "$NINJA_EXIT"
          fi

      - name: Verify build output
        working-directory: cuberite
        run: |
          echo "Top-level contents of Server directory after build:"
          ls -la Server/

          if [ ! -f Server/Cuberite ]; then
            echo "::error::Cuberite binary was NOT produced by the build. Checking ninja log for the link step..."
            grep -i -E "Linking|Cuberite" Release/ninja-build.log | tail -50 || true
            exit 1
          fi

          echo "Cuberite binary found:"
          ls -la Server/Cuberite
          file Server/Cuberite

      - name: Smoke test (basic startup check)
        working-directory: cuberite/Server
        run: |
          # Cuberite needs the accompanying Server directory assets next to the binary
          timeout 5 ./Cuberite || true
          file ./Cuberite
          ldd ./Cuberite || true

      - name: Package build output
        id: package
        run: |
          NAME="cuberite-alpine-musl-${{ github.sha }}"
          ARCHIVE_PATH="${GITHUB_WORKSPACE}/${NAME}.tar.gz"

          # Archive is written to an absolute path OUTSIDE the Server
          # directory being packaged, to avoid tar including/corrupting
          # itself while it is still being written.
          cd cuberite/Server
          tar -czf "${ARCHIVE_PATH}" .

          echo "archive_name=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify archive contents
        run: |
          echo "Listing archive contents:"
          tar -tzf "${{ steps.package.outputs.archive_path }}"
          echo "Confirming the Cuberite binary is present:"
          tar -tzf "${{ steps.package.outputs.archive_path }}" | grep -qx './Cuberite'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # This job intentionally runs OUTSIDE the Alpine container.
    # Release-creation actions ship a glibc-linked Node runtime, which
    # does not run correctly on musl (Alpine), so it must run on the
    # default Ubuntu runner instead.
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.publish_release == 'true'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.archive_name }}
          path: dist

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Cuberite (Alpine/musl) - ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          files: dist/${{ needs.build.outputs.archive_name }}
